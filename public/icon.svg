<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="glassA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="50%" y2="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="liquidGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Liquid Ambient Glow -->
  <circle cx="200" cy="180" r="130" fill="#6366f1" opacity="0.25" filter="url(#liquidGlow)" />
  <circle cx="330" cy="310" r="120" fill="#06b6d4" opacity="0.2" filter="url(#liquidGlow)" />

  <!-- Glass Inner Border -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2" />

  <!-- Center HMD Music Liquid Motif: stylized soundwave play emblem -->
  <g transform="translate(136, 126)">
    <!-- Wave bars with glass capsule finish -->
    <rect x="16" y="80" width="18" height="100" rx="9" fill="url(#glassA)" opacity="0.7" />
    <rect x="52" y="40" width="18" height="180" rx="9" fill="url(#glassA)" opacity="0.85" />
    <rect x="88" y="10" width="18" height="240" rx="9" fill="url(#glassA)" />
    <!-- Dynamic Play Arrow interacting with soundwaves -->
    <path d="M 140 50 L 230 130 L 140 210 Z" fill="url(#glassA)" filter="url(#liquidGlow)" />
    <!-- Specular highlight on play arrow -->
    <path d="M 142 58 L 218 130 L 142 150 Z" fill="url(#shineGrad)" />
  </g>

  <!-- Lettering hint: HMD -->
  <text x="256" y="420" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="700" fill="#ffffff" letter-spacing="8" opacity="0.9">HMD MUSIC</text>
</svg>
